[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-nspm"
version = "0.1.0"
description = "Open-source Network Security Policy Management platform"
authors = [{name = "OpenNSPM"}]
requires-python = ">=3.11"
dependencies = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
plugins = []
