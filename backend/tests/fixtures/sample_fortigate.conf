config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "Web-Servers"
        set subnet 192.0.2.10 255.255.255.255
    next
end

config firewall policy
    edit 1
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "Web-Servers"
        set service "ALL"
        set action accept
        set status enable
        set logtraffic all
        set schedule "always"
        set comments "Allow web"
        set uuid 11111111-2222-3333-4444-555555555555
        set nat enable
    next
    edit 2
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "Web-Servers"
        set service "ALL"
        set action accept
        set status disable
        set logtraffic disable
        set schedule "always"
        set uuid 66666666-7777-8888-9999-000000000000
    next
end
